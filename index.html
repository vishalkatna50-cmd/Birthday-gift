<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Muskan 🎉</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#a1c4fd,#c2e9fb);
font-family:Arial;
overflow:hidden;
}

.card{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
animation:pop 1.5s ease;
z-index:2;
max-width:400px;
}

h1{
color:#ff4d6d;
}

p{
color:#444;
line-height:1.6;
}

button{
margin-top:15px;
padding:12px 20px;
border:none;
border-radius:25px;
background:#4d96ff;
color:white;
cursor:pointer;
}

button:hover{
background:#2f7de1;
}

#msg{
display:none;
margin-top:15px;
color:#2e7d32;
font-weight:bold;
animation:fade 1s ease;
}

@keyframes pop{
from{transform:scale(0.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

.heart{
position:absolute;
color:#ff4d6d;
animation:float 6s linear infinite;
font-size:18px;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<div class="card">
<h1>🎉 Happy Birthday Muskan 🎂</h1>

<p>
Wishing you a very Happy Birthday 🎊<br>
May your day be full of smiles, fun, and happiness 💙
</p>

<p>
You are a wonderful friend, Muskan ✨<br>
Stay happy always and keep shining!
</p>

<button onclick="showMsg()">Click for Surprise 🎁</button>

<div id="msg">
🎉 Have an amazing year ahead, my friend Muskan! 🎂💙
</div>
</div>

<script>
// floating hearts
for(let i=0;i<30;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(Math.random()*3+3)+"s";
h.style.fontSize=(Math.random()*18+12)+"px";
document.body.appendChild(h);
}

function showMsg(){
document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
